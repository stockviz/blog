services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen2.5-0.5b
    restart: unless-stopped
    environment:
      HF_HOME: /models/.cache/huggingface
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --hf-repo
      - Qwen/Qwen2.5-0.5B-Instruct-GGUF
      - --hf-file
      - qwen2.5-0.5b-instruct-q5_k_m.gguf
      - --n-gpu-layers
      - "0"
      - --threads
      - "4"
      - --threads-batch
      - "4"
      - --ctx-size
      - "4096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
